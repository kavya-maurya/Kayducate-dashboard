<!-- Mobile Hamburger -->
<button class="menu-toggle" (click)="toggleSidebar()">

  ☰

</button>

<!-- Mobile Overlay -->
<div
  class="overlay"
  *ngIf="isSidebarOpen"
  (click)="closeSidebar()">
</div>

<!-- Sidebar -->
<div
  class="sidebar"
  [class.mobile-open]="isSidebarOpen">

  <!-- Logo -->
  <div class="logo">
    <span>Student Portal</span>
  </div>

  <!-- Navigation -->
  <nav>

    <a
      routerLink="/student/dashboard"
      routerLinkActive="active"
      (click)="closeSidebar()">

      <span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
          fill="currentColor" viewBox="0 0 16 16">
          <path
            d="M6 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5 6s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zM11 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 1-.5-.5m.5 2.5a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1zm2 3a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1zm0 3a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1z"/>
        </svg>
      </span>

      Dashboard

    </a>

    <a
      routerLink="/student/task"
      routerLinkActive="active"
      (click)="closeSidebar()">

      <span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
          fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd"
            d="M6 1h6v7a.5.5 0 0 1-.757.429L9 7.083 6.757 8.43A.5.5 0 0 1 6 8z"/>
          <path
            d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-1h1v1a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v1H1V2a2 2 0 0 1 2-2"/>
          <path
            d="M1 5v-.5a.5.5 0 0 1 1 0V5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0V8h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0v.5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1"/>
        </svg>
      </span>

      Daily Task

    </a>

    <a
      routerLink="/student/profile"
      routerLinkActive="active"
      (click)="closeSidebar()">

      <span>
        <svg xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          viewBox="0 0 16 16">
          <path
            d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
        </svg>
      </span>

      Profile

    </a>

    <a
      routerLink="/student/courses"
      routerLinkActive="active"
      (click)="closeSidebar()">

      <span>
        <svg xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          viewBox="0 0 16 16">
          <path
            d="M8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 .783z"/>
        </svg>
      </span>

      Courses

    </a>

    <a
      routerLink="/student/attendance"
      routerLinkActive="active"
      (click)="closeSidebar()">

      <span>
        <svg xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          viewBox="0 0 16 16">
          <path
            d="M4 .5a.5.5 0 0 0-1 0V1H2a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-1V.5a.5.5 0 0 0-1 0V1H4V.5zM3.5 4a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H4a.5.5 0 0 1-.5-.5V4zM16 14V5H0v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1z"/>
        </svg>
      </span>

      Attendance

    </a>

  </nav>

  <!-- Logout -->
  <div class="logout">

    <a
      routerLink="/auth/login"
      (click)="logout()">

      🚪 Logout

    </a>

  </div>

</div>
